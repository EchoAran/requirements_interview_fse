# ==============================================================================
# Elicitation Core (需求半结构化访谈核心机制引擎) 配置文件示例
# 
# 复制此文件为 default.yaml 即可开始配置与运行：
#   cp configs/default.example.yaml configs/default.yaml
#
# 详细字段说明与调优指南请参阅：docs/configuration.md
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. 大语言模型服务配置 (Model Configuration)
# ------------------------------------------------------------------------------
model:
  # 模型服务提供方类型，推荐使用 openai_compatible 协议
  provider: "openai_compatible"

  # 大模型 API 端点完整 URL (需兼容 OpenAI Chat Completions 接口格式)
  # 示例:
  #   - OpenAI 官方: "https://api.openai.com/v1/chat/completions"
  #   - DeepSeek 官方: "https://api.deepseek.com/v1/chat/completions"
  #   - 通义千问: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
  #   - Ollama 本地部署: "http://localhost:11434/v1/chat/completions"
  api_url: "https://api.openai.com/v1/chat/completions"

  # 从指定名称的环境变量中自动读取 API Key (推荐做法，避免明文泄露)
  api_key_env: "LLM_API_KEY"

  # 直接指定 API Key (若留空，系统将自动优先读取 api_key_env 或 OPENAI_API_KEY 环境变量)
  api_key: ""

  # 调用的模型名称标识 (例如: gpt-4o, gpt-4o-mini, deepseek-chat, qwen-plus 等)
  model_name: "gpt-4o"

  # 采样温度 (0.0 ~ 1.0)。较低的温度有助于生成格式严谨的 JSON 并保证结构化推理稳定性
  temperature: 0.2

  # 单次网络请求超时上限 (单位: 秒)
  timeout_seconds: 60.0

  # 遭遇网络超时、断连或服务端限流时的最大自动重试次数
  max_retries: 3


# ------------------------------------------------------------------------------
# 2. 用户交互控制意图配置 (Intent Controller Configuration)
# ------------------------------------------------------------------------------
intent:
  # 用户控制意图识别的直接生效置信度阈值 (0.0 ~ 1.0)
  # 高于此值时，系统直接执行话题跳转 (switch_existing_topic)、拒绝 (refuse_topic) 或结项 (stop_interview)
  confidence_threshold: 0.60

  # 用户控制意图的二次确认置信度门限 (0.0 ~ 1.0)
  # 介于 confirmation_threshold 与 confidence_threshold 之间时，触发 confirm_control 策略向用户主动求证
  confirmation_threshold: 0.40


# ------------------------------------------------------------------------------
# 3. 七因子动态调度器权重配置 (Scheduler Weights Configuration)
# 说明：系统会自动对以下 7 项权重进行归一化校验与计算
# ------------------------------------------------------------------------------
scheduler:
  weights:
    # 初始先验权重 (基于大纲定义的初始重要度与先后顺序)
    initial_prior: 0.15

    # 依赖就绪度权重 (前序依赖话题是否均已完成，就绪度高者优先)
    dependency_readiness: 0.20

    # 信息缺口率权重 (必填槽位为空白的比例，缺口越大权重越高)
    unresolved_gap: 0.20

    # 冲突信号权重 (主题内存在未化解的矛盾或冲突槽位时，优先调度进行澄清)
    conflict_signal: 0.15

    # 最新涌现权重 (最新对话中动态涌现出的新需求方向，赋予探索倾向)
    recent_emergence: 0.10

    # 对话连续性权重 (倾向于在当前主题未完成前保持连续深入，避免跳跃感)
    continuity: 0.15

    # 用户发言相关度权重 (受访者最新回答中主动提及该主题时的相关度得分)
    user_relevance: 0.05


# ------------------------------------------------------------------------------
# 4. 提问策略规划配置 (Strategy Configuration)
# ------------------------------------------------------------------------------
strategy:
  # 单轮提问聚焦填补的最大目标槽位数量 (建议设为 1，避免多槽位引发受访者认知过载)
  max_target_slots: 1

  # 槽位内容过短字数判定门限 (字符数低于此值时判定回答不够详尽，倾向触发 deepen 策略深挖)
  short_value_char_threshold: 12

  # 动态涌现话题创建后的连续深挖保护轮次窗口
  emergence_deepen_turn_window: 2


# ------------------------------------------------------------------------------
# 5. 上下文预算与 Token 裁剪配置 (Context Budget & Token Management)
# ------------------------------------------------------------------------------
context_budget:
  # 提问生成 Prompt 全局最大 Token 上限 (超出且裁剪后仍超限将触发确定性规则降级回退)
  max_prompt_tokens: 3500

  # 对话历史窗口区块的最大 Token 预算
  max_recent_turn_tokens: 800

  # 关联证据溯源区块的最大 Token 预算
  max_target_evidence_tokens: 800

  # 跨主题已知事实区块的最大 Token 预算
  max_known_info_tokens: 600

  # 当前主题槽位清单区块的最大 Token 预算
  max_current_slots_tokens: 600

  # 全局主题大纲目录区块的最大 Token 预算
  max_catalog_tokens: 400

  # 对话历史保留的最大轮次对数量 (1 轮对 = 1 问 + 1 答)
  history_window_size: 6

  # 当前主题装配至 Prompt 中的最大槽位数量
  max_current_topic_slots: 15


# ------------------------------------------------------------------------------
# 6. 运行时系统行为配置 (Runtime System Configuration)
# ------------------------------------------------------------------------------
runtime:
  # 单次访谈生命周期的最大安全轮次上限 (防止异常逻辑导致死循环)
  max_turns: 50

  # 是否使用原子重命名写入 state.json (保障意外断电/宕机时状态文件不损坏)
  atomic_state_write: true

  # 是否在 llm_calls.jsonl 中记录完整的原始大模型响应文本
  log_raw_llm_response: true

  # 是否在 llm_calls.jsonl 中记录渲染后的完整 Prompt 文本
  save_prompt_text: true

  # 访谈项目持久化数据存储根目录 (相对路径或绝对路径)
  runs_dir: "runs"

  # 提示词模板文件根目录
  prompts_dir: "prompts"

  # 主题必须槽位完成度达标阈值 (高于此值且无空缺时触发 verify 闭环确认)
  strategy_completion_threshold: 0.60

  # 静态拓扑排序中依赖深度与连通度的排序权重
  priority_dep_weight: 0.60

  # 静态拓扑排序中章节自然结构顺序的排序权重
  priority_section_weight: 0.40
